          "$GODOT_BIN" --headless --path godot \
            --script res://tests/character_profile_runtime_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_CHARACTER_PROFILE_RUNTIME_OK profiles=4 transforms=2 negative=9' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during character-profile binding." >&2
            exit 1
          fi

      - name: Share deterministic NPC interaction across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-npc-interaction-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/npc_interaction_controller_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_NPC_INTERACTION_OK profiles=4 direct=4 nearest=true stable-tie=true input-edge=2 negative=2' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during shared NPC interaction." >&2
            exit 1
          fi

      - name: Import all three exact verified candidate packs
        shell: pwsh
        run: |
          & scripts/run-exact-pack-set.ps1 `
            -DescriptorPath $env:MAPSOO_PACK_SET_DESCRIPTOR `
            -ExtractedRoot $env:MAPSOO_PACK_SET_EXTRACTED `
            -GodotConsole $env:GODOT_BIN

      - name: Import the reproducible External Host bridge pack
        shell: pwsh
        run: |
          & scripts/run-external-host-pack-godot.ps1 `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'mapsoo-candidate-packs/external-host') `
            -GodotConsole $env:GODOT_BIN

  godot-windows-smoke:
    name: Godot ${{ matrix.version }} Windows transaction smoke
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.3"
            url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip
            archive: Godot_v4.3-stable_win64.exe.zip
            executable: Godot_v4.3-stable_win64_console.exe
            sha512: ad09b7e19949327700dfbe64e35880a2a08091c0751277f5cc21b915e5df9b4fe93fb43c50d6bdfb9d16b46168592491aa698e0d2dbe9f92132e163dd77b97e1
          - version: "4.7"
            url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
            archive: Godot_v4.7-stable_win64.exe.zip
            executable: Godot_v4.7-stable_win64_console.exe
            sha512: 41645a908eb3181d6f2d1201ed7b6d6f095f6a23aaed8903d5d255277cc8d142814f3e6817f865b3cac142c39b8aff99280091d3bbdaa301517730b3ba0522b9

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the exact verified candidate pack set
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check.outputs.pack_artifact }}
          path: ${{ runner.temp }}/mapsoo-candidate-packs

      - name: Verify and extract the candidate pack set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'mapsoo-candidate-packs'
          $descriptorPath = Join-Path $artifact 'pack-set.json'
          $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
          if ($descriptor.schemaVersion -ne 1 -or @($descriptor.packs).Count -ne 3) { throw 'Invalid three-pack descriptor.' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'mapsoo-candidate-extracted'
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          foreach ($pack in @($descriptor.packs)) {
            $zip = Join-Path $artifact $pack.file
            $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $pack.sha256) { throw "$($pack.id) SHA-256 mismatch: $actualHash" }
            Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot
            $root = Join-Path $extractRoot $pack.archiveRoot
            $manifestPath = Join-Path $root 'mapsoo.manifest.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.pack.id -ne $pack.id -or $manifest.schema_version -ne $pack.schemaVersion) { throw "$($pack.id) manifest identity mismatch." }
            if (@(Get-ChildItem -LiteralPath $root -Recurse -File).Count -ne @($manifest.files).Count + 1) { throw "$($pack.id) manifest coverage mismatch." }
          }
          "MAPSOO_PACK_SET_DESCRIPTOR=$descriptorPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAPSOO_PACK_SET_EXTRACTED=$extractRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify Godot ${{ matrix.version }}
        shell: pwsh
        env:
          GODOT_ARCHIVE: ${{ matrix.archive }}
          GODOT_EXECUTABLE: ${{ matrix.executable }}
          GODOT_SHA512: ${{ matrix.sha512 }}
          GODOT_URL: ${{ matrix.url }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $env:RUNNER_TEMP $env:GODOT_ARCHIVE
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $env:GODOT_URL -OutFile $archivePath
              break
            }
            catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Godot download attempt $attempt failed; retrying."
              if (Test-Path -LiteralPath $archivePath) { Remove-Item -LiteralPath $archivePath -Force }
              Start-Sleep -Seconds 2
            }
          }
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:GODOT_SHA512) { throw "Godot SHA-512 mismatch: $actualHash" }
          $installDir = Join-Path $env:RUNNER_TEMP "mapsoo-godot-${{ matrix.version }}-windows"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir
          $godotBin = Join-Path $installDir $env:GODOT_EXECUTABLE
          if (-not (Test-Path -LiteralPath $godotBin -PathType Leaf)) { throw 'Godot console executable is missing.' }
          "GODOT_BIN=$godotBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Print Godot version
        shell: pwsh
        run: '& $env:GODOT_BIN --version'

      - name: Check importer GDScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'res://addons/mapsoo_importer/mapsoo_pack_importer.gd',
            'res://addons/mapsoo_importer/mapsoo_pack_07.gd',
            'res://addons/mapsoo_importer/mapsoo_pack_08.gd',
            'res://addons/mapsoo_importer/mapsoo_pack_09.gd',
            'res://addons/mapsoo_importer/mapsoo_pack_10.gd',
            'res://addons/mapsoo_importer/mapsoo_world_layout_attachment.gd',
            'res://addons/mapsoo_importer/mapsoo_world_layout_materializer.gd',
            'res://addons/mapsoo_importer/mapsoo_world_material_palette.gd',
            'res://addons/mapsoo_importer/mapsoo_world_material_palette_attachment.gd',
            'res://addons/mapsoo_importer/mapsoo_world_terrain_autotile.gd',
            'res://addons/mapsoo_importer/mapsoo_world_terrain_autotile_attachment.gd',
            'res://addons/mapsoo_importer/mapsoo_world_art_runtime_overlay.gd',
            'res://addons/mapsoo_importer/mapsoo_world_art_runtime_overlay_applier.gd',
            'res://addons/mapsoo_importer/runtime/mapsoo_player_controller.gd',
            'res://addons/mapsoo_importer/runtime/mapsoo_isometric_player_controller.gd',
            'res://addons/mapsoo_importer/runtime/mapsoo_layered_depth_player_controller.gd',
            'res://addons/mapsoo_importer/runtime/mapsoo_character_profile_runtime.gd',
            'res://addons/mapsoo_importer/runtime/mapsoo_npc_interaction_controller.gd',
            'res://addons/mapsoo_importer/mapsoo_importer_plugin.gd',
            'res://example/main.gd',
            'res://tests/generate_fixture.gd',
            'res://tests/import_smoke.gd',
            'res://tests/import_pack_cli.gd',
            'res://tests/import_alpha9_smoke.gd',
            'res://tests/import_alpha9_playable_smoke.gd',
            'res://tests/import_alpha10_smoke.gd',
            'res://tests/import_alpha10_playable_smoke.gd',
            'res://tests/import_alpha11_smoke.gd',
            'res://tests/import_alpha11_playable_smoke.gd',
            'res://tests/import_alpha12_smoke.gd',
            'res://tests/import_alpha12_playable_smoke.gd',
            'res://tests/import_pack10_controlled_smoke.gd',
            'res://tests/world_layout_attachment_smoke.gd',
            'res://tests/world_layout_materializer_smoke.gd',
            'res://tests/world_material_palette_smoke.gd',
            'res://tests/world_terrain_autotile_smoke.gd',
            'res://tests/world_art_runtime_overlay_smoke.gd',
            'res://tests/world_art_runtime_overlay_applier_smoke.gd',
            'res://tests/character_profile_test_fixture.gd',
            'res://tests/runtime_shell_smoke.gd',
            'res://tests/character_profile_runtime_smoke.gd',
            'res://tests/npc_interaction_controller_smoke.gd',
            'res://tests/texture_persistence_probe.gd'
          )
          foreach ($script in $scripts) {
            $output = @(& $env:GODOT_BIN --headless --path godot --check-only --script $script 2>&1)
            $output | ForEach-Object { Write-Host $_.ToString() }
            if ($LASTEXITCODE -ne 0 -or ($output | ForEach-Object { $_.ToString() }) -match '^(?:SCRIPT )?ERROR:') {
              throw "GDScript syntax check failed: $script"
            }
          }

      - name: Prove portable texture persistence on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& $env:GODOT_BIN --headless --path godot --script res://tests/texture_persistence_probe.gd 2>&1)
          $output | ForEach-Object { Write-Host $_.ToString() }
          $text = $output -join "`n"
          if (
            $LASTEXITCODE -ne 0 -or
            -not $text.Contains('MAPSOO_TEXTURE_PERSISTENCE_PROBE_OK') -or
            -not $text.Contains('default_pixels=false') -or
            -not $text.Contains('keep_before_pixels=true') -or
            -not $text.Contains('keep_after_pixels=false')
          ) {
            throw 'Portable texture persistence probe failed.'
          }

      - name: Run Windows importer transaction contract
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File godot/tests/run-smoke.ps1 -GodotConsole $env:GODOT_BIN

      - name: Stage and import the generated Pack 0.6 fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = Join-Path (Resolve-Path godot/tests).Path '.generated/pack-alpha9'
