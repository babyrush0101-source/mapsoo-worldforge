name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pack_artifact: ${{ steps.candidate-pack.outputs.artifact }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            video/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install historical alpha.1 video dependencies
        run: pnpm --dir video install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: pnpm security:audit

      - name: Run project checks
        run: pnpm check

      - name: Verify immutable public GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:history:remote

      - name: Verify the real browser exporter matches the registered candidate pack
        run: pnpm release:browser:verify

      - name: Build and verify the reproducible GitHub release bundle
        shell: bash
        run: |
          set -euo pipefail
          lifecycle="$(node --input-type=module --eval "import { CURRENT_RELEASE_CONFIG } from './scripts/release-config.mjs'; process.stdout.write(CURRENT_RELEASE_CONFIG.lifecycle)")"
          if [ "$lifecycle" = candidate ]; then
            pnpm release:local
          else
            test "$lifecycle" = published
            echo "Published release bytes are verified from GitHub by release:history:remote; rebuilding is intentionally disabled."
            node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { CURRENT_RELEASE_CONFIG, REPOSITORY_ROOT } from './scripts/release-config.mjs';
          import { examplePacksForConfig, sha256 } from './scripts/release-lib.mjs';

          const config = CURRENT_RELEASE_CONFIG;
          const outputRoot = join(REPOSITORY_ROOT, 'release', config.tag);
          await mkdir(outputRoot, { recursive: true });
          for (const pack of examplePacksForConfig(config)) {
            const fileName = config.release.files[pack.releaseFileKey];
            const url = `https://github.com/babyrush0101-source/mapsoo-worldforge/releases/download/${config.tag}/${fileName}`;
            const response = await fetch(url, { redirect: 'follow' });
            if (!response.ok) throw new Error(`Unable to download ${pack.id}: HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const actualHash = sha256(bytes);
            const expectedHash = config.publicReleaseAssetSha256[fileName];
            if (actualHash !== expectedHash) throw new Error(`${pack.id} published SHA-256 mismatch: ${actualHash}`);
            await writeFile(join(outputRoot, fileName), bytes);
            console.log(`MAPSOO_PUBLISHED_PACK_DOWNLOADED id=${pack.id} bytes=${bytes.length} sha256=${actualHash}`);
          }
          NODE
          fi

      - name: Verify historical alpha.1 video source and committed MP4
        run: pnpm --dir video lint && pnpm --dir video verify:source && pnpm --dir video verify:output

      - name: Generate the Pack 0.6 Godot fixture through the public pipeline
        env:
          MAPSOO_ALPHA9_FIXTURE_ROOT: release/godot-pack-set/alpha9
        run: pnpm exec vitest run --config godot/tests/vitest.alpha9-fixture.config.ts

      - name: Generate the Pack 0.7 Godot fixture through the public pipeline
        env:
          MAPSOO_ALPHA10_FIXTURE_ROOT: release/godot-pack-set/alpha10
        run: pnpm exec vitest run --config godot/tests/vitest.alpha10-fixture.config.ts

      - name: Generate the Pack 0.8 Godot fixture through the public pipeline
        env:
          MAPSOO_ALPHA11_FIXTURE_ROOT: release/godot-pack-set/alpha11
        run: pnpm exec vitest run --config godot/tests/vitest.alpha11-fixture.config.ts

      - name: Generate the Pack 0.9 Godot fixture through the public pipeline
        env:
          MAPSOO_ALPHA12_FIXTURE_ROOT: release/godot-pack-set/alpha12
        run: pnpm exec vitest run --config godot/tests/vitest.alpha12-fixture.config.ts

      - name: Bind the public example packs and External Host bridge pack for Godot jobs
        id: candidate-pack
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { cp, mkdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { CURRENT_RELEASE_CONFIG, REPOSITORY_ROOT } from './scripts/release-config.mjs';
          import { examplePacksForConfig, sha256 } from './scripts/release-lib.mjs';
          const config = CURRENT_RELEASE_CONFIG;
          const stage = join(REPOSITORY_ROOT, 'release', 'godot-pack-set');
          await mkdir(stage, { recursive: true });
          const descriptors = [];
          for (const pack of examplePacksForConfig(config)) {
            const file = config.release.files[pack.releaseFileKey];
            const source = join(REPOSITORY_ROOT, 'release', config.tag, file);
            const bytes = await readFile(source);
            if (sha256(bytes) !== pack.expectedSha256) throw new Error(`${pack.id} staged hash mismatch`);
            await cp(source, join(stage, file));
            const manifest = JSON.parse(await readFile(join(REPOSITORY_ROOT, pack.sourceDirectory, 'mapsoo.manifest.json'), 'utf8'));
            const world = JSON.parse(await readFile(join(REPOSITORY_ROOT, pack.sourceDirectory, 'worlds', `${pack.id}.world.json`), 'utf8'));
            const demo = JSON.parse(await readFile(join(REPOSITORY_ROOT, pack.sourceDirectory, 'worlds', 'demo-world.json'), 'utf8'));
            const places = JSON.parse(await readFile(join(REPOSITORY_ROOT, pack.sourceDirectory, 'runtime', 'places.json'), 'utf8'));
            const structures = JSON.parse(await readFile(join(REPOSITORY_ROOT, pack.sourceDirectory, 'runtime', 'structures.json'), 'utf8'));
            descriptors.push({ id: pack.id, file, sha256: pack.expectedSha256, archiveRoot: pack.archiveRoot, schemaVersion: manifest.schema_version, cellCount: world.map.width * world.map.height, propCount: demo.props.length, placeCount: places.places.length, structureCount: structures.structures.length });
          }
          await writeFile(join(stage, 'pack-set.json'), `${JSON.stringify({ schemaVersion: 1, packs: descriptors }, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact=mapsoo-example-packs-${config.tag}\npath=${stage}\n`);
          NODE
          pnpm external-host:export -- \
            --input examples/integrations/external-host/river-valley-asset-request.json \
            --out-dir release/godot-pack-set/external-host \
            --completed-at 2026-07-19T12:00:00.000Z

      - name: Upload the verified candidate pack set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate-pack.outputs.artifact }}
          path: ${{ steps.candidate-pack.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  godot-smoke:
    name: Godot ${{ matrix.version }} smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.3"
            url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
            archive: Godot_v4.3-stable_linux.x86_64.zip
            executable: Godot_v4.3-stable_linux.x86_64
            sha256: 7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21
          - version: "4.7"
            url: https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
            archive: Godot_v4.7-stable_linux.x86_64.zip
            executable: Godot_v4.7-stable_linux.x86_64
            sha256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install World Runner verifier dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the exact verified candidate pack set
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check.outputs.pack_artifact }}
          path: ${{ runner.temp }}/mapsoo-candidate-packs

      - name: Verify and extract the candidate pack set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:RUNNER_TEMP 'mapsoo-candidate-packs'
          $descriptorPath = Join-Path $artifact 'pack-set.json'
          $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
          if ($descriptor.schemaVersion -ne 1 -or @($descriptor.packs).Count -ne 3) { throw 'Invalid three-pack descriptor.' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'mapsoo-candidate-extracted'
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          foreach ($pack in @($descriptor.packs)) {
            $zip = Join-Path $artifact $pack.file
            $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $pack.sha256) { throw "$($pack.id) SHA-256 mismatch: $actualHash" }
            Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot
            $root = Join-Path $extractRoot $pack.archiveRoot
            $manifestPath = Join-Path $root 'mapsoo.manifest.json'
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.pack.id -ne $pack.id -or $manifest.schema_version -ne $pack.schemaVersion) { throw "$($pack.id) manifest identity mismatch." }
            if (@(Get-ChildItem -LiteralPath $root -Recurse -File).Count -ne @($manifest.files).Count + 1) { throw "$($pack.id) manifest coverage mismatch." }
          }
          "MAPSOO_PACK_SET_DESCRIPTOR=$descriptorPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAPSOO_PACK_SET_EXTRACTED=$extractRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify Godot ${{ matrix.version }}
        shell: bash
        env:
          GODOT_ARCHIVE: ${{ matrix.archive }}
          GODOT_EXECUTABLE: ${{ matrix.executable }}
          GODOT_SHA256: ${{ matrix.sha256 }}
          GODOT_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/mapsoo-godot-${{ matrix.version }}"
          archive_path="$RUNNER_TEMP/$GODOT_ARCHIVE"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive_path" "$GODOT_URL"
          printf '%s  %s\n' "$GODOT_SHA256" "$archive_path" \
            | sha256sum --check --strict -
          unzip -q "$archive_path" -d "$install_dir"
          godot_bin="$install_dir/$GODOT_EXECUTABLE"
          test -f "$godot_bin"
          chmod +x "$godot_bin"
          printf 'GODOT_BIN=%s\n' "$godot_bin" >> "$GITHUB_ENV"

      - name: Print Godot version
        run: '"$GODOT_BIN" --version'

      - name: Check GDScript syntax
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            res://addons/mapsoo_importer/mapsoo_pack_importer.gd
            res://addons/mapsoo_importer/mapsoo_pack_07.gd
            res://addons/mapsoo_importer/mapsoo_pack_08.gd
            res://addons/mapsoo_importer/mapsoo_pack_09.gd
            res://addons/mapsoo_importer/mapsoo_pack_10.gd
            res://addons/mapsoo_importer/mapsoo_world_layout_attachment.gd
            res://addons/mapsoo_importer/mapsoo_world_layout_materializer.gd
            res://addons/mapsoo_importer/mapsoo_world_material_palette.gd
            res://addons/mapsoo_importer/mapsoo_world_material_palette_attachment.gd
            res://addons/mapsoo_importer/mapsoo_world_terrain_autotile.gd
            res://addons/mapsoo_importer/mapsoo_world_terrain_autotile_attachment.gd
            res://addons/mapsoo_importer/mapsoo_world_art_runtime_overlay.gd
            res://addons/mapsoo_importer/mapsoo_world_art_runtime_overlay_applier.gd
            res://addons/mapsoo_importer/runtime/mapsoo_player_controller.gd
            res://addons/mapsoo_importer/runtime/mapsoo_isometric_player_controller.gd
            res://addons/mapsoo_importer/runtime/mapsoo_layered_depth_player_controller.gd
            res://addons/mapsoo_importer/runtime/mapsoo_character_profile_runtime.gd
            res://addons/mapsoo_importer/runtime/mapsoo_npc_interaction_controller.gd
            res://addons/mapsoo_importer/mapsoo_importer_plugin.gd
            res://example/main.gd
            res://tests/import_smoke.gd
            res://tests/import_pack_cli.gd
            res://tests/import_alpha9_smoke.gd
            res://tests/import_alpha9_playable_smoke.gd
            res://tests/import_alpha10_smoke.gd
            res://tests/import_alpha10_playable_smoke.gd
            res://tests/import_alpha11_smoke.gd
            res://tests/import_alpha11_playable_smoke.gd
            res://tests/import_alpha12_smoke.gd
            res://tests/import_alpha12_playable_smoke.gd
            res://tests/import_pack10_controlled_smoke.gd
            res://tests/world_layout_attachment_smoke.gd
            res://tests/world_layout_materializer_smoke.gd
            res://tests/world_material_palette_smoke.gd
            res://tests/world_terrain_autotile_smoke.gd
            res://tests/world_art_runtime_overlay_smoke.gd
            res://tests/world_art_runtime_overlay_applier_smoke.gd
            res://tests/character_profile_test_fixture.gd
            res://tests/runtime_shell_smoke.gd
            res://tests/character_profile_runtime_smoke.gd
            res://tests/npc_interaction_controller_smoke.gd
            res://tests/texture_persistence_probe.gd
          )
          for script in "${scripts[@]}"; do
            log_file="$RUNNER_TEMP/mapsoo-check-$(basename "$script").log"
            "$GODOT_BIN" --headless --path godot --check-only \
              --script "$script" 2>&1 | tee "$log_file"
            if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
              echo "Godot emitted an engine error while checking $script." >&2
              exit 1
            fi
          done

      - name: Prove portable texture persistence
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-texture-persistence-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/texture_persistence_probe.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_TEXTURE_PERSISTENCE_PROBE_OK' "$log_file"
          grep -Fq 'default_pixels=false' "$log_file"
          grep -Fq 'keep_before_pixels=true' "$log_file"
          grep -Fq 'keep_after_pixels=false' "$log_file"

      - name: Generate deterministic fixture
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-fixture-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/generate_fixture.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error while generating fixtures." >&2
            exit 1
          fi

      - name: Stage the generated Pack 0.6 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/tests/.generated/pack-alpha9
          cp -R "$RUNNER_TEMP/mapsoo-candidate-packs/alpha9/." godot/tests/.generated/pack-alpha9/

      - name: Stage the generated Pack 0.7 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/tests/.generated/pack-alpha10
          cp -R "$RUNNER_TEMP/mapsoo-candidate-packs/alpha10/." godot/tests/.generated/pack-alpha10/

      - name: Stage the generated Pack 0.8 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/tests/.generated/pack-alpha11
          cp -R "$RUNNER_TEMP/mapsoo-candidate-packs/alpha11/." godot/tests/.generated/pack-alpha11/

      - name: Stage the generated Pack 0.9 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/tests/.generated/pack-alpha12
          cp -R "$RUNNER_TEMP/mapsoo-candidate-packs/alpha12/." godot/tests/.generated/pack-alpha12/

      - name: Import generated resources in the editor
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-editor-import-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --editor --path godot --import 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error while importing test resources." >&2
            exit 1
          fi

      - name: Run importer smoke contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-godot-smoke-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the smoke test." >&2
            exit 1
          fi

      - name: Run Pack 0.6 complete-farm importer contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha9-godot-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha9_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.6 smoke test." >&2
            exit 1
          fi

      - name: Run Pack 0.6 playable physics contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha9-playable-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha9_playable_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.6 playable test." >&2
            exit 1
          fi

      - name: Run Pack 0.7 side-platformer importer contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha10-godot-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha10_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.7 smoke test." >&2
            exit 1
          fi

      - name: Run Pack 0.7 playable physics contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha10-playable-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha10_playable_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.7 playable test." >&2
            exit 1
          fi

      - name: Run Pack 0.8 isometric-action importer contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha11-godot-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha11_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.8 smoke test." >&2
            exit 1
          fi

      - name: Run Pack 0.8 playable physics contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha11-playable-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha11_playable_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.8 playable test." >&2
            exit 1
          fi

      - name: Run Pack 0.9 layered-depth importer contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha12-godot-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha12_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.9 smoke test." >&2
            exit 1
          fi

      - name: Run Pack 0.9 playable physics contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-alpha12-playable-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_alpha12_playable_smoke.gd 2>&1 | tee "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 0.9 playable test." >&2
            exit 1
          fi

      - name: Run Pack 1.0 licensed-production controlled importer contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-pack10-controlled-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/import_pack10_controlled_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_PACK10_CONTROLLED_OK' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the Pack 1.0 controlled importer test." >&2
            exit 1
          fi

      - name: Bind confirmed WorldLayoutPlan attachments across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-world-layout-attachment-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/world_layout_attachment_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_WORLD_LAYOUT_ATTACHMENT_OK profiles=4 absent=1 negative=8' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during WorldLayoutPlan attachment binding." >&2
            exit 1
          fi

      - name: Materialize confirmed WorldLayoutPlan geometry across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-world-layout-materializer-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/world_layout_materializer_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_WORLD_LAYOUT_MATERIALIZER_OK profiles=4 deterministic=4 persisted=4 handoff=4 controller-exit=4 absent=1 tamper=2' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during WorldLayoutPlan geometry materialization." >&2
            exit 1
          fi

      - name: Bind production TileSets to logical materials across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-world-material-palette-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/world_material_palette_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_WORLD_MATERIAL_PALETTE_OK profiles=4 visible=4 projected=4 persisted=4 tamper=4' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during WorldMaterialPalette binding." >&2
            exit 1
          fi

      - name: Select 16-variant terrain transitions across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-world-terrain-autotile-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/world_terrain_autotile_smoke.gd 2>&1 | tee "$log_file"
          grep -Eq '^MAPSOO_WORLD_TERRAIN_AUTOTILE_OK profiles=4 variants=[1-9][0-9]* persisted=4 tamper=4 fallback=4$' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during terrain autotile selection." >&2
            exit 1
          fi

      - name: Load and persist reviewed runtime overlays across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-world-art-runtime-overlay-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/world_art_runtime_overlay_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_WORLD_ART_RUNTIME_OVERLAY_OK profiles=4 loaded=4 persisted=4 grants=1 tamper=6 executable_files=0' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during runtime overlay loading." >&2
            exit 1
          fi

      - name: Apply reviewed world art and gameplay across all world types
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-world-art-runtime-overlay-applier-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/world_art_runtime_overlay_applier_smoke.gd 2>&1 | tee "$log_file"
          grep -Eq '^MAPSOO_WORLD_ART_RUNTIME_OVERLAY_APPLIER_OK profiles=4 terrain=[1-9][0-9]* landmarks=[1-9][0-9]* hazards=8 characters=4 persisted=4 tamper=9$' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during runtime overlay visual application." >&2
            exit 1
          fi

      - name: Run generated-world runtime shell contract
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/mapsoo-runtime-shell-${{ matrix.version }}.log"
          "$GODOT_BIN" --headless --path godot \
            --script res://tests/runtime_shell_smoke.gd 2>&1 | tee "$log_file"
          grep -Fq 'MAPSOO_RUNTIME_SHELL_OK safe_path=true farm=true side=true isometric=true layered=true replacement=true character_profiles=4 npc_interactions=4' "$log_file"
          if grep -Eq '^(SCRIPT )?ERROR:' "$log_file"; then
            echo "Godot emitted an engine error during the runtime-shell test." >&2
            exit 1
          fi

      - name: Build, launch, and reproduce a World Runner PCK
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-world-runner-pck.mjs --godot-bin "$GODOT_BIN"

      - name: Bind portable character profiles across all world types
        shell: bash
        run: |
          set -euo pipefail
