          $lines | ForEach-Object { Write-Host $_ }
          if (
            $LASTEXITCODE -ne 0 -or
            $lines -match '^(?:SCRIPT )?ERROR:' -or
            -not ($lines -contains 'MAPSOO_WORLD_ART_RUNTIME_OVERLAY_OK profiles=4 loaded=4 persisted=4 grants=1 tamper=6 executable_files=0')
          ) {
            throw 'WorldArtRuntimeOverlay loading failed.'
          }

      - name: Apply reviewed world art and gameplay across all world types on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& $env:GODOT_BIN --headless --path godot --script res://tests/world_art_runtime_overlay_applier_smoke.gd 2>&1)
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | ForEach-Object { Write-Host $_ }
          if (
            $LASTEXITCODE -ne 0 -or
            $lines -match '^(?:SCRIPT )?ERROR:' -or
            -not ($lines -match '^MAPSOO_WORLD_ART_RUNTIME_OVERLAY_APPLIER_OK profiles=4 terrain=[1-9][0-9]* landmarks=[1-9][0-9]* hazards=8 characters=4 persisted=4 tamper=9$')
          ) {
            throw 'WorldArtRuntimeOverlay visual application failed.'
          }

      - name: Run generated-world runtime shell contract on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& $env:GODOT_BIN --headless --path godot --script res://tests/runtime_shell_smoke.gd 2>&1)
          $lines = @($output | ForEach-Object { $_.ToString() })
          $lines | ForEach-Object { Write-Host $_ }
          if (
