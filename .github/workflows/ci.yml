            $lines -match '^(?:SCRIPT )?ERROR:' -or
            -not ($lines -match '^MAPSOO_RUNTIME_SHELL_OK safe_path=true farm=true side=true isometric=true layered=true replacement=true character_profiles=4 npc_interactions=4$')
          ) {
            throw 'Generated-world runtime shell contract failed.'
          }

      - name: Bind portable character profiles across all world types on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& $env:GODOT_BIN --headless --path godot --script res://tests/character_profile_runtime_smoke.gd 2>&1)
          $lines = @($output | ForEach-Object { $_.ToString() })
