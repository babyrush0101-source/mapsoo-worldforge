          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'mapsoo-candidate-packs/alpha9/*') -Destination $fixtureRoot -Recurse -Force
          $output = @(& $env:GODOT_BIN --headless --editor --path godot --import 2>&1)
          $output | ForEach-Object { Write-Host $_.ToString() }
          if ($LASTEXITCODE -ne 0 -or ($output | ForEach-Object { $_.ToString() }) -match '^(?:SCRIPT )?ERROR:') {
            throw 'Godot failed to import Pack 0.6 fixture resources.'
          }

      - name: Run Pack 0.6 complete-farm importer contract on Windows
        shell: pwsh
        run: |
