            $LASTEXITCODE -ne 0 -or
            $lines -match '^(?:SCRIPT )?ERROR:' -or
            -not ($lines -contains 'MAPSOO_CHARACTER_PROFILE_RUNTIME_OK profiles=4 transforms=2 negative=9')
          ) {
            throw 'Portable character-profile runtime binding failed.'
          }

      - name: Share deterministic NPC interaction across all world types on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = @(& $env:GODOT_BIN --headless --path godot --script res://tests/npc_interaction_controller_smoke.gd 2>&1)
          $lines = @($output | ForEach-Object { $_.ToString() })
